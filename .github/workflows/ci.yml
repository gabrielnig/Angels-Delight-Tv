name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Integration test files skip themselves when this is unset.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # SECURITY.md section 13: fail on high or critical advisories in shipped dependencies.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      # Plain grep scan, since gitleaks is not available everywhere. Never prints the matched value.
      - name: Secret scan
        run: scripts/secret-scan.sh

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # M33-S02: the production build must compile, not only typecheck.
      - name: Build
        run: pnpm --filter @ad/web build

      # Semgrep with the typescript and security-audit packs. Findings need a reviewed nosemgrep note.
      - name: Static analysis
        run: |
          pip install --quiet semgrep==1.186.0
          scripts/sast.sh

      # CycloneDX bill of materials for the runtime dependencies, kept with the run.
      - name: SBOM
        run: node scripts/sbom.mjs sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      # Never the whole suite (docs/DECISIONS.md D-012). Only tests affected by this change.
      - name: Affected tests
        run: pnpm exec vitest run --changed origin/main --passWithNoTests

      # Check the branch commits, not the merge commit GitHub builds for the PR, which it authors itself.
      - name: Footprint
        if: github.event_name == 'pull_request'
        run: scripts/footprint-check.sh --range origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}
