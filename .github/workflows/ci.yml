name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Integration test files skip themselves when this is unset.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # SECURITY.md section 13: fail on high or critical advisories in shipped dependencies.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      # Plain grep scan, since gitleaks is not available everywhere. Never prints the matched value.
      - name: Secret scan
        run: scripts/secret-scan.sh

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Share tag rules self test
        run: pnpm share:check --self-test

      # M33-S02: the production build must compile, not only typecheck.
      - name: Build
        run: pnpm --filter @ad/web build

      # Semgrep with the typescript and security-audit packs. Findings need a reviewed nosemgrep note.
      - name: Static analysis
        run: |
          pip install --quiet semgrep==1.186.0
          scripts/sast.sh

      # CycloneDX bill of materials for the runtime dependencies, kept with the run.
      - name: SBOM
        run: node scripts/sbom.mjs sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      # Never the whole suite (docs/DECISIONS.md D-012). Only tests affected by this change.
      - name: Affected tests
        run: pnpm exec vitest run --changed origin/main --passWithNoTests

      # Check the branch commits, not the merge commit GitHub builds for the PR, which it authors itself.
      - name: Footprint
        if: github.event_name == 'pull_request'
        run: scripts/footprint-check.sh --range origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}

  # M34-S01: axe-core on every key page, signed out, signed in and admin, plus a 320 px overflow check.
  # Runs against the fixture build, so no database is needed. Only the a11y spec is run (D-012).
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @ad/web build
      - name: Start the fixture server
        run: |
          scripts/ci-fixture-env.sh 3113 > .env.ci-fixture
          set -a; . ./.env.ci-fixture; set +a
          (cd apps/web && NODE_ENV=development nohup pnpm exec next start -p 3113 > ../../server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3113/api/health && break; sleep 2; done
      - name: Share tags and pictures of the public pages
        run: pnpm share:check --base http://localhost:3113
      - run: pnpm exec playwright install --with-deps chromium
      - name: Axe on the key pages
        env:
          E2E_BASE_URL: http://localhost:3113
        run: pnpm exec playwright test apps/web/e2e/a11y.e2e.ts --config apps/web/playwright.config.ts --project=desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-report
          path: |
            apps/web/test-results
            server.log

  # M25-S02 AC3: Lighthouse on Home, mobile profile, against ops/lighthouse/budget.json.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @ad/web build
      - name: Start the fixture server
        run: |
          scripts/ci-fixture-env.sh 3113 > .env.ci-fixture
          set -a; . ./.env.ci-fixture; set +a
          (cd apps/web && NODE_ENV=development nohup pnpm exec next start -p 3113 > ../../server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3113/api/health && break; sleep 2; done
      - name: Lighthouse on Home
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: ops/lighthouse/run.sh http://localhost:3113/
